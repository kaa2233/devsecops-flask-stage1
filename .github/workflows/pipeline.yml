name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Run Semgrep
        run: semgrep scan --config auto --error app.py

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install bandit
      - name: Scan Python source
        run: bandit -r app.py -ll

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint Flask
      - name: Run Pylint
        run: pylint app.py --fail-under=8.0

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  stage1-summary:
    name: Stage 1 Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gitleaks
      - semgrep
      - bandit
      - hadolint
      - pylint
      - pip-audit
      - pytest
    outputs:
      security_score: ${{ steps.calculate.outputs.security_score }}
    steps:
      - name: Calculate and publish score
        id: calculate
        env:
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          BANDIT: ${{ needs.bandit.result }}
          HADOLINT: ${{ needs.hadolint.result }}
          PYLINT: ${{ needs.pylint.result }}
          PIP_AUDIT: ${{ needs.pip-audit.result }}
          PYTEST: ${{ needs.pytest.result }}
        run: |
          python - <<'PY'
          import os

          checks = {
              "Gitleaks": os.environ["GITLEAKS"],
              "Semgrep": os.environ["SEMGREP"],
              "Bandit": os.environ["BANDIT"],
              "Hadolint": os.environ["HADOLINT"],
              "Pylint": os.environ["PYLINT"],
              "pip-audit": os.environ["PIP_AUDIT"],
              "pytest": os.environ["PYTEST"],
          }

          passed = sum(result == "success" for result in checks.values())
          score = round((passed / len(checks)) * 100)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"security_score={score}\n")

          lines = [
              "## Stage 1 Security & Quality Summary",
              "",
              f"**Score: {score}/100 ({passed}/{len(checks)} checks passed)**",
              "",
              "| Check | Result |",
              "|---|---|",
          ]

          for name, result in checks.items():
              icon = "✅" if result == "success" else "❌"
              lines.append(f"| {name} | {icon} `{result}` |")

          lines.extend([
              "",
              "> Stage 2 Security Gate requires a minimum security score of 80/100.",
          ])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

  security-gate:
    name: Stage 2 - Security Gate
    runs-on: ubuntu-latest
    needs:
      - stage1-summary
    steps:
      - name: Evaluate Security Score
        env:
          SECURITY_SCORE: ${{ needs.stage1-summary.outputs.security_score }}
        run: |
          echo "=================================="
          echo "       STAGE 2 SECURITY GATE"
          echo "=================================="
          echo "Security Score: ${SECURITY_SCORE}/100"
          echo "Minimum Required: 80/100"

          if [ -z "$SECURITY_SCORE" ]; then
            echo "ERROR: Security score is missing."
            exit 1
          fi

          if [ "$SECURITY_SCORE" -ge 80 ]; then
            echo "RESULT: SECURITY GATE PASSED"
            echo "Pipeline is allowed to continue."
          else
            echo "RESULT: SECURITY GATE FAILED"
            echo "Pipeline is blocked because the score is below 80."
            exit 1
          fi

  docker-build:
    name: Stage 3 - Docker Build
    runs-on: ubuntu-latest
    needs:
      - security-gate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: devsecops-flask:stage3
          outputs: type=docker,dest=/tmp/devsecops-flask.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/devsecops-flask.tar
          retention-days: 1

  trivy-scan:
    name: Stage 3 - Trivy Image Scan
    runs-on: ubuntu-latest
    needs:
      - docker-build
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/devsecops-flask.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-flask:stage3
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  syft-sbom:
    name: Stage 3 - Syft SBOM
    runs-on: ubuntu-latest
    needs:
      - docker-build
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/devsecops-flask.tar

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: devsecops-flask:stage3
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom.spdx.json
          path: sbom.spdx.json
          retention-days: 90

  cosign-sign:
    name: Stage 3 - Cosign Image Signing
    runs-on: ubuntu-latest
    needs:
      - trivy-scan
      - syft-sbom
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/devsecops-flask.tar

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        env:
          IMAGE_STAGE3: ghcr.io/${{ github.repository }}:stage3
          IMAGE_SHA: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          docker tag devsecops-flask:stage3 "$IMAGE_STAGE3"
          docker tag devsecops-flask:stage3 "$IMAGE_SHA"
          docker push "$IMAGE_STAGE3"
          docker push "$IMAGE_SHA"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign image with Cosign
        env:
          IMAGE_SHA: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          cosign sign --yes "$IMAGE_SHA"

      - name: Verify image signature
        env:
          IMAGE_SHA: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          cosign verify "$IMAGE_SHA" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

  deploy-staging:
    name: Stage 4 - Deploy Staging
    runs-on: [self-hosted, Linux, X64]
    needs: cosign-sign
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Verify signed image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Pull signed image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy staging container
        run: |
          docker rm -f flask-staging || true
          docker run -d \
            --name flask-staging \
            --restart unless-stopped \
            -p 5000:5000 \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Staging health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/; then
              echo "Staging health check PASSED"
              exit 0
            fi
            sleep 2
          done

          docker logs flask-staging
          exit 1

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io || true

  zap-dast:
    name: Stage 4 - OWASP ZAP DAST
    runs-on: [self-hosted, Linux, X64]
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Prepare report directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-results"

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE/zap-results:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -r zap-report.html \
            -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-zap-report
          path: zap-results/zap-report.html
          if-no-files-found: warn
          retention-days: 30

  deploy-production:
    name: Stage 4 - Production Deployment
    runs-on: [self-hosted, Linux, X64]
    needs: zap-dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Verify production image signature
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Pull release image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy production with automatic rollback
        shell: bash
        run: |
          set -e

          IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          HAD_PREVIOUS=false

          echo "Preparing production deployment..."

          # Remove an obsolete backup container.
          if docker container inspect flask-production-previous >/dev/null 2>&1; then
            docker rm -f flask-production-previous
          fi

          # Preserve the currently running production container.
          if docker container inspect flask-production >/dev/null 2>&1; then
            docker stop flask-production
            docker rename flask-production flask-production-previous
            HAD_PREVIOUS=true
          fi

          # Start the new production version.
          if ! docker run -d \
            --name flask-production \
            --restart unless-stopped \
            -p 5001:5000 \
            "$IMAGE"; then

            echo "New deployment failed. Starting rollback..."

            docker rm -f flask-production || true

            if [ "$HAD_PREVIOUS" = true ]; then
              docker rename flask-production-previous flask-production
              docker start flask-production
              echo "Previous production version restored."
            fi

            exit 1
          fi

          # Check application health.
          HEALTHY=false

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/; then
              HEALTHY=true
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" = true ]; then
            echo "Production health check PASSED"

            if [ "$HAD_PREVIOUS" = true ]; then
              docker rm -f flask-production-previous
            fi

            echo "Production deployment successful."
          else
            echo "Production health check FAILED."
            echo "Starting automatic rollback..."

            docker logs flask-production || true
            docker rm -f flask-production || true

            if [ "$HAD_PREVIOUS" = true ]; then
              docker rename flask-production-previous flask-production
              docker start flask-production
              echo "Previous production version restored."
            else
              echo "No previous production version was available."
            fi

            exit 1
          fi

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io || true